# Optional GitHub Actions trigger: runs ONLY when `README.md` is added or updated!
# Drop into `.github/workflows/notify-hub.yml` if you also want remote GitHub push triggers.

name: Sync Completed Project README to Career Hub

on:
  push:
    branches:
      - main
      - master
    paths:
      - "README.md"

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Send README release trigger to career-sync-hub /analyze
        env:
          HUB_URL: ${{ secrets.CAREER_HUB_URL }}
          HUB_SECRET: ${{ secrets.CAREER_HUB_SECRET }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          HOMEPAGE_URL: ${{ github.event.repository.homepage }}
        run: |
          jq -n \
            --arg repo_url "$REPO_URL" \
            --arg live_demo_link "$HOMEPAGE_URL" \
            --argjson is_private "$IS_PRIVATE" \
            '{
              repo_url: $repo_url,
              is_private: $is_private,
              live_demo_link: (if $live_demo_link == "" then null else $live_demo_link end),
              update_portfolio: true,
              post_to_linkedin: true
            }' > payload.json

          curl --fail-with-body --silent --show-error \
            -X POST "${HUB_URL%/}/analyze" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${HUB_SECRET}" \
            -d @payload.json
